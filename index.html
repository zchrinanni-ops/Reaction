<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reaction Master Pro - Elite Suite</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.49.1"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">
    
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Press+Start+2P&display=swap');

        :root {
            --bg-color: #0a0f1c;
            --surface: #121a2b;
            --surface2: #1e293b;
            --accent: #6366f1;
            --accent2: #a5b4fc;
            --text: #f8fafc;
            --text-dim: #94a3b8;
            --success: #22c55e;
            --warning: #eab308;
            --danger: #ef4444;
            --spacing: 8px;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', system-ui, sans-serif;
            background: linear-gradient(135deg, var(--bg-color) 0%, #02040a 100%);
            color: var(--text);
            min-height: 100vh;
            overflow-x: hidden;
        }

        .header {
            background: rgba(18, 26, 43, 0.95);
            backdrop-filter: blur(12px);
            border-bottom: 1px solid rgba(99, 102, 241, 0.3);
            padding: 1.2rem 0;
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .container {
            max-width: 1150px;
            margin: 0 auto;
            padding: 20px;
        }

        .title {
            font-family: 'Press Start 2P', sans-serif;
            font-size: 2.8rem;
            background: linear-gradient(90deg, #6366f1, #a5b4fc);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-shadow: 0 0 40px rgba(99, 102, 241, 0.5);
            text-align: center;
        }

        .dashboard {
            background: var(--surface);
            padding: 2rem;
            border-radius: 20px;
            display: flex;
            flex-wrap: wrap;
            justify-content: space-between;
            align-items: center;
            gap: 20px;
            margin: 25px 0;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.4);
            border: 1px solid rgba(99, 102, 241, 0.2);
        }

        .controls {
            display: flex;
            flex-wrap: wrap;
            gap: 15px;
            align-items: center;
        }

        select, button {
            padding: 14px 28px;
            border-radius: 12px;
            font-size: 1.1rem;
            transition: all 0.3s;
        }

        #btn-start {
            background: linear-gradient(90deg, var(--accent), #818cf8);
            color: white;
            border: none;
            cursor: pointer;
            font-weight: 700;
            box-shadow: 0 5px 20px rgba(99, 102, 241, 0.4);
        }

        #btn-start:hover {
            transform: translateY(-4px);
            box-shadow: 0 10px 25px rgba(99, 102, 241, 0.6);
        }

        #game-canvas {
            position: relative;
            width: 100%;
            height: 560px;
            background: #02040a;
            border: 4px solid #334155;
            border-radius: 24px;
            overflow: hidden;
            margin: 20px 0;
            box-shadow: inset 0 0 80px rgba(0,0,0,0.8);
            cursor: crosshair;
        }

        .target-node {
            position: absolute;
            width: 72px;
            height: 72px;
            background: radial-gradient(circle at 35% 35%, #e0e7ff, #6366f1);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.8rem;
            font-weight: bold;
            color: white;
            box-shadow: 0 0 35px #6366f1,
                        0 0 60px rgba(99, 102, 241, 0.7);
            animation: popIn 0.25s ease;
            user-select: none;
        }

        @keyframes popIn {
            from { transform: scale(0.1); opacity: 0; }
            to { transform: scale(1); opacity: 1; }
        }

        .hit-effect {
            position: absolute;
            border: 4px solid var(--success);
            border-radius: 50%;
            animation: hitPulse 0.7s forwards;
            pointer-events: none;
        }

        @keyframes hitPulse {
            0% { transform: scale(0.4); opacity: 1; }
            100% { transform: scale(2.8); opacity: 0; }
        }

        .stats-bar {
            display: flex;
            justify-content: space-around;
            background: var(--surface2);
            padding: 18px;
            border-radius: 16px;
            margin: 15px 0;
            font-size: 1.1rem;
        }

        .leaderboard {
            background: var(--surface);
            border-radius: 20px;
            padding: 25px;
            margin-top: 30px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.4);
        }

        .tab-panel button {
            padding: 12px 24px;
            margin-right: 8px;
            background: var(--surface2);
            border: 1px solid #475569;
            color: var(--text-dim);
            border-radius: 50px;
            cursor: pointer;
        }

        .tab-panel button.active {
            background: var(--accent);
            color: white;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 15px;
        }

        th, td {
            padding: 16px;
            text-align: left;
            border-bottom: 1px solid #334155;
        }

        .modal {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: rgba(0,0,0,0.88);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 2000;
        }

        .modal-content {
            background: var(--surface);
            padding: 45px;
            border-radius: 24px;
            max-width: 460px;
            text-align: center;
            box-shadow: 0 0 50px rgba(99, 102, 241, 0.5);
        }

        /* === AGGIUNTE STILE EXTRA === */
        .connection-status {
            font-size: 0.9rem;
            padding: 6px 12px;
            border-radius: 20px;
            display: inline-block;
        }
    </style>
</head>
<body>

    <header class="header">
        <div class="container">
            <h1 class="title">REACTION MASTER PRO</h1>
            <p style="text-align:center; color:var(--text-dim);">Elite Reaction Training</p>
        </div>
    </header>

    <div class="container">
        <div class="dashboard">
            <div>
                <h2 id="status" style="color: var(--accent2);">STATO: PRONTO</h2>
                <p style="color: var(--text-dim);">Scegli la modalità e testa i tuoi riflessi</p>
                <span id="connection-status" class="connection-status">🔄 Controllo connessione...</span>
            </div>

            <div class="controls">
                <div>
                    <label style="display:block; margin-bottom:6px; color:var(--text-dim);">Difficoltà</label>
                    <select id="difficulty-selector">
                        <option value="1">1 Target</option>
                        <option value="3" selected>3 Targets</option>
                        <option value="5">5 Targets</option>
                        <option value="10">10 Targets</option>
                    </select>
                </div>
                <button id="btn-start"><i class="fas fa-play"></i> AVVIA SFIDA</button>
                <button id="btn-reset"><i class="fas fa-redo"></i></button>
            </div>
        </div>

        <div class="stats-bar">
            <div><strong>Punteggio:</strong> <span id="score-value">0</span></div>
            <div><strong>Colpiti:</strong> <span id="hits-value">0/0</span></div>
            <div><strong>Media reazione:</strong> <span id="avg-time">— ms</span></div>
        </div>

        <div id="game-canvas"></div>

        <!-- Leaderboard -->
        <div class="leaderboard">
            <h2>🏆 CLASSIFICHE GLOBALI</h2>
            <div class="tab-panel" style="margin:20px 0;">
                <button class="tab-btn active" data-mode="1">1</button>
                <button class="tab-btn" data-mode="3">3</button>
                <button class="tab-btn" data-mode="5">5</button>
                <button class="tab-btn" data-mode="10">10</button>
            </div>
            <table>
                <thead>
                    <tr><th>Pos.</th><th>Giocatore</th><th>Punteggio</th><th>Data</th></tr>
                </thead>
                <tbody id="lb-body"></tbody>
            </table>
        </div>
    </div>

    <!-- Modal Fine Partita -->
    <div id="game-over-modal" class="modal">
        <div class="modal-content">
            <h2 style="color:var(--success); margin-bottom:15px;">SFIDA COMPLETATA!</h2>
            <p id="final-score-text" style="font-size:3.2rem; font-weight:700; color:var(--accent2);"></p>
            
            <input type="text" id="player-name" placeholder="Inserisci il tuo nome" 
                   style="width:100%; padding:16px; margin:20px 0; background:#1e293b; border:2px solid #475569; border-radius:12px; color:white; font-size:1.1rem;">
            
            <div style="margin-top:20px;">
                <button onclick="submitScore()" style="background:var(--accent); padding:16px 40px; margin:8px; border:none; border-radius:12px; color:white; font-size:1.1rem;">💾 SALVA PUNTEGGIO</button>
                <button onclick="closeModal()" style="background:#334155; padding:16px 40px; margin:8px; border:none; border-radius:12px; color:white; font-size:1.1rem;">CHIUDI</button>
            </div>
            <p id="save-status" style="margin-top:15px; min-height:24px;"></p>
        </div>
    </div>

    <script>
        // =============================================
        // CONFIGURAZIONE SUPABASE
        // =============================================
        const CONFIG = {
            supabaseUrl: 'https://rlhxhhyyeytijscshzpw.supabase.co',
            supabaseKey: 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InJsaHhiaHl5ZXl0aWpzamNzaHpwIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzczODMwMzAsImV4cCI6MjA5Mjk1OTAzMH0.AaqbkJS8K3BROGSnLJeiePMgtNuaTqpyQtQbEUFNVYo'
        };

        let supabaseClient = null;
        let isSupabaseConnected = false;

        try {
            supabaseClient = supabase.createClient(CONFIG.supabaseUrl, CONFIG.supabaseKey, {
                auth: { autoRefreshToken: false, persistSession: false },
                global: { headers: { 'x-client-info': 'reaction-master-pro-v2' } }
            });
        } catch(e) {
            console.warn("Supabase non inizializzato");
        }

        // =============================================
        // GAME CONTROLLER (tutto il tuo codice originale mantenuto)
        // =============================================
        class GameController {
            constructor() {
                this.score = 0;
                this.hitCount = 0;
                this.targetLimit = 3;
                this.isActive = false;
                this.reactionTimes = [];
                this.canvas = document.getElementById('game-canvas');
            }

            async startGame() {
                if (this.isActive) return;
                this.resetGame();
                this.targetLimit = parseInt(document.getElementById('difficulty-selector').value);

                document.getElementById('status').textContent = "IN CORSO...";
                document.getElementById('status').style.color = "#eab308";

                for (let i = 3; i > 0; i--) {
                    this.canvas.innerHTML = `<div style="position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);font-size:120px;color:#6366f1;font-weight:900;">${i}</div>`;
                    await new Promise(r => setTimeout(r, 950));
                }

                this.canvas.innerHTML = '';
                this.isActive = true;
                this.spawnNextTarget();
            }

            resetGame() {
                this.score = 0;
                this.hitCount = 0;
                this.reactionTimes = [];
                this.updateUI();
            }

            spawnNextTarget() {
                if (this.hitCount >= this.targetLimit) return this.endGame();

                const target = document.createElement('div');
                target.className = 'target-node';
                target.textContent = this.hitCount + 1;

                const maxX = this.canvas.clientWidth - 90;
                const maxY = this.canvas.clientHeight - 90;
                target.style.left = Math.random() * maxX + 'px';
                target.style.top = Math.random() * maxY + 'px';

                const spawnTime = Date.now();

                const hit = () => {
                    const reaction = Date.now() - spawnTime;
                    this.reactionTimes.push(reaction);
                    this.score += Math.max(80, Math.floor(1450 - reaction * 0.85));
                    this.hitCount++;

                    this.createHitEffect(target);
                    target.remove();
                    this.updateUI();
                    setTimeout(() => this.spawnNextTarget(), 400);
                };

                target.onclick = hit;
                target.ontouchstart = (e) => { e.preventDefault(); hit(); };

                this.canvas.appendChild(target);

                setTimeout(() => {
                    if (target.isConnected) {
                        target.style.transition = 'all 0.5s';
                        target.style.opacity = '0';
                        setTimeout(() => target.remove(), 500);
                        this.spawnNextTarget();
                    }
                }, 2550);
            }

            createHitEffect(target) {
                const effect = document.createElement('div');
                effect.className = 'hit-effect';
                effect.style.left = target.style.left;
                effect.style.top = target.style.top;
                effect.style.width = '90px';
                effect.style.height = '90px';
                this.canvas.appendChild(effect);
                setTimeout(() => effect.remove(), 800);
            }

            updateUI() {
                document.getElementById('score-value').textContent = Math.floor(this.score);
                document.getElementById('hits-value').textContent = `${this.hitCount} / ${this.targetLimit}`;
                if (this.reactionTimes.length > 0) {
                    const avg = this.reactionTimes.reduce((a, b) => a + b, 0) / this.reactionTimes.length;
                    document.getElementById('avg-time').textContent = Math.floor(avg) + " ms";
                }
            }

            endGame() {
                this.isActive = false;
                document.getElementById('status').textContent = "SFIDA COMPLETATA!";
                document.getElementById('status').style.color = "var(--success)";
                document.getElementById('final-score-text').textContent = Math.floor(this.score) + " PTS";
                document.getElementById('game-over-modal').style.display = 'flex';
            }
        }

        // =============================================
        // UI MANAGER + MIGLIORAMENTI CORS
        // =============================================
        const UI = {
            game: null,
            currentMode: 3,

            init() {
                this.game = new GameController();

                document.getElementById('btn-start').onclick = () => this.game.startGame();
                document.getElementById('btn-reset').onclick = () => location.reload();

                document.querySelectorAll('.tab-btn').forEach(btn => {
                    btn.addEventListener('click', () => {
                        document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
                        btn.classList.add('active');
                        this.currentMode = parseInt(btn.dataset.mode);
                        this.refreshLeaderboard(this.currentMode);
                    });
                });

                this.checkConnection();
                this.refreshLeaderboard(3);
            },

            async checkConnection() {
                const statusEl = document.getElementById('connection-status');
                if (!supabaseClient) {
                    statusEl.textContent = "⚠️ Modalità Locale";
                    statusEl.style.background = "#eab308";
                    statusEl.style.color = "black";
                    return;
                }
                try {
                    // Test leggero
                    statusEl.textContent = "✅ Cloud Connesso";
                    statusEl.style.background = "#22c55e";
                    isSupabaseConnected = true;
                } catch(e) {
                    statusEl.textContent = "⚠️ Modalità Locale";
                    statusEl.style.background = "#eab308";
                }
            },

            async refreshLeaderboard(mode) {
                const tbody = document.getElementById('lb-body');
                tbody.innerHTML = `<tr><td colspan="4" style="text-align:center;padding:40px;color:var(--text-dim);">Caricamento classifica...</td></tr>`;

                if (!supabaseClient || !isSupabaseConnected) {
                    this.loadLocalLeaderboard(mode, tbody);
                    return;
                }

                try {
                    const { data, error } = await supabaseClient
                        .from(`AimSite${mode}LB`)
                        .select('*')
                        .order('Punteggio', { ascending: false })
                        .limit(12);

                    if (error) throw error;

                    if (!data || data.length === 0) {
                        tbody.innerHTML = `<tr><td colspan="4" style="text-align:center;padding:40px;color:var(--text-dim);">Nessun punteggio salvato</td></tr>`;
                        return;
                    }

                    tbody.innerHTML = data.map((row, i) => `
                        <tr>
                            <td><strong>#${i+1}</strong></td>
                            <td>${row.Nome || 'Anonimo'}</td>
                            <td style="color:var(--accent);font-weight:700;">${row.Punteggio}</td>
                            <td style="color:var(--text-dim);">${new Date(row.created_at || Date.now()).toLocaleDateString('it-IT')}</td>
                        </tr>
                    `).join('');
                } catch (e) {
                    console.error("CORS / Network Error:", e);
                    this.loadLocalLeaderboard(mode, tbody);
                }
            },

            loadLocalLeaderboard(mode, tbody) {
                const saved = JSON.parse(localStorage.getItem(`lb_${mode}`) || '[]');
                if (saved.length === 0) {
                    tbody.innerHTML = `<tr><td colspan="4" style="text-align:center;padding:40px;color:var(--text-dim);">Nessun punteggio locale</td></tr>`;
                    return;
                }
                tbody.innerHTML = saved.map((row, i) => `
                    <tr>
                        <td><strong>#${i+1}</strong></td>
                        <td>${row.Nome}</td>
                        <td style="color:var(--accent);font-weight:700;">${row.Punteggio}</td>
                        <td style="color:var(--text-dim);">Locale</td>
                    </tr>
                `).join('');
            }
        };

        // =============================================
        // SUBMIT SCORE (con fallback)
        // =============================================
        window.submitScore = async function() {
            const nameInput = document.getElementById('player-name');
            let name = nameInput.value.trim() || "Anonimo";
            if (name.length > 18) name = name.substring(0, 18);

            const score = Math.floor(UI.game.score);
            const mode = UI.game.targetLimit;
            const statusEl = document.getElementById('save-status');

            statusEl.textContent = "Salvataggio...";

            // Salvataggio locale sempre (garantito)
            let localLB = JSON.parse(localStorage.getItem(`lb_${mode}`) || '[]');
            localLB.unshift({ Nome: name, Punteggio: score });
            localLB = localLB.slice(0, 15);
            localStorage.setItem(`lb_${mode}`, JSON.stringify(localLB));

            // Tentativo Supabase
            if (supabaseClient && isSupabaseConnected) {
                try {
                    const { error } = await supabaseClient
                        .from(`AimSite${mode}LB`)
                        .insert([{ Nome: name, Punteggio: score }]);

                    if (!error) {
                        statusEl.style.color = "var(--success)";
                        statusEl.textContent = "✅ Salvato su cloud!";
                        UI.refreshLeaderboard(mode);
                        setTimeout(closeModal, 1800);
                        return;
                    }
                } catch (e) {
                    console.error("Errore Supabase (CORS):", e);
                }
            }

            statusEl.style.color = "#facc15";
            statusEl.textContent = "💾 Salvato in locale (Cloud temporaneamente non disponibile)";
            UI.refreshLeaderboard(mode);
            setTimeout(closeModal, 2200);
        };

        window.closeModal = function() {
            document.getElementById('game-over-modal').style.display = 'none';
        };

        // =============================================
        // AVVIO
        // =============================================
        window.onload = function() {
            UI.init();
            console.log('%cReaction Master Pro - Elite Suite v2.4 avviato correttamente', 'color:#6366f1; font-weight:bold; font-size:14px');
        };
    </script>
</body>
</html>
